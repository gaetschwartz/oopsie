name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'stable' && 'stable' || '' }}
      CARGO_FEATURES: ${{ matrix.toolchain == 'nightly' && '-F unstable' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest
        run: cargo nextest run --workspace ${CARGO_FEATURES}
        env:
          OOPSIE_BACKTRACE_SNAPSHOT_TESTS: "1"
      - name: cargo doctest
        run: cargo test --doc --workspace ${CARGO_FEATURES}

  lints:
    name: Lints (fmt + clippy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'stable' && 'stable' || '' }}
      CARGO_FEATURES: ${{ matrix.toolchain == 'nightly' && '-F unstable' || '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Get Rust toolchain version
        id: get_rust_version
        run: echo "version=$(rustup show active-toolchain | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.get_rust_version.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lints
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets ${CARGO_FEATURES} -- -D warnings
  
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Get MSRV from Cargo.toml
        id: get_msrv
        run: |
          MSRV=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "oopsie") | .rust_version')
          rustup override set $MSRV
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
