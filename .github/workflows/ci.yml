name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, [${{ matrix.features }}])
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        features:
          - ""
          - "serde"
          - "tracing"
          - "serde,tracing"
          - "chrono"
          - "jiff"
          - "extras"
          - "fancy,tracing"
          - "fancy,serde,tracing,chrono"
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'stable' && 'stable' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest
        run: >
          cargo nextest run --workspace --no-default-features
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
        env:
          OOPSIE_BACKTRACE_SNAPSHOT_TESTS: ${{ matrix.features == 'fancy,serde,tracing,chrono' && '1' || '' }}
      - name: cargo doctest
        run: >
          cargo test --doc --workspace --no-default-features
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}

  lints:
    name: Lints (fmt + clippy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'stable' && 'stable' || '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Get Rust toolchain version
        id: get_rust_version
        run: echo "version=$(rustup show active-toolchain | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.get_rust_version.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lints
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (bare)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings
      - name: cargo clippy (serde)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          --features serde
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings
      - name: cargo clippy (tracing)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          --features tracing
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings
      - name: cargo clippy (serde,tracing)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          --features serde,tracing
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings
      - name: cargo clippy (chrono)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          --features chrono
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings
      - name: cargo clippy (fancy,tracing)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          --features fancy,tracing
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings
      - name: cargo clippy (full)
        run: >
          cargo clippy --workspace --all-targets --no-default-features
          --features fancy,serde,tracing,chrono
          ${{ matrix.toolchain == 'nightly' && '--features unstable' || '' }}
          -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Get MSRV from Cargo.toml
        id: get_msrv
        run: |
          MSRV=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "oopsie") | .rust_version')
          rustup override set $MSRV
      - name: cargo check (bare)
        run: cargo check --workspace --all-targets --locked --no-default-features
      # MSRV runs on stable, so the unstable-* features (which gate nightly
      # `#![feature]`s, E0554 on stable) are excluded; this is the maximal
      # stable feature surface.
      - name: cargo check (max stable features)
        run: >
          cargo check --workspace --all-targets --locked --no-default-features
          --features fancy,serde,tracing,chrono,jiff,extras

  no_std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get Rust toolchain version
        id: get_rust_version
        run: echo "version=$(rustup show active-toolchain | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.get_rust_version.outputs.version }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: no_std
      - name: cargo build (oopsie-core, bare)
        run: cargo build -p oopsie-core --no-default-features
      - name: cargo build (oopsie-core, serde)
        run: cargo build -p oopsie-core --no-default-features --features serde
      - name: cargo build (oopsie, bare)
        run: cargo build -p oopsie --no-default-features
      - name: cargo build (nostd-smoke, thumbv7em-none-eabihf)
        run: cargo build --manifest-path crates/nostd-smoke/Cargo.toml --target thumbv7em-none-eabihf
      - name: assert fancy + no_std is rejected
        run: "! cargo build -p oopsie --no-default-features --features fancy 2>/dev/null"

  docs:
    name: Docs (rustdoc, -D warnings)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'stable' && 'stable' || '' }}
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - name: Get Rust toolchain version
        id: get_rust_version
        run: echo "version=$(rustup show active-toolchain | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.get_rust_version.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-${{ matrix.toolchain }}
      # nightly mirrors the docs.rs all-features build; stable can't enable the
      # unstable-* features, so it documents the curated stable surface.
      - name: cargo doc
        run: >
          cargo doc --no-deps --workspace
          ${{ matrix.toolchain == 'nightly' && '--all-features' || '--no-default-features --features fancy,serde,tracing,chrono,jiff,extras' }}
