name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      # rust-toolchain.toml pins nightly-2026-05-05; override it so the matrix
      # entry actually selects the requested channel.
      - name: Pin workspace toolchain
        run: rustup override set ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo check (default features)
        run: cargo check --workspace --all-targets

      # `compile_fail_tests` is the trybuild snapshot suite — its expected
      # `.stderr` files match stable rustc's diagnostic span shape. Nightly
      # rustc draws wider underlines on the same diagnostics, so we exclude
      # the test from the nightly job. The macro behavior under test isn't
      # toolchain-specific; only the rendered span is.
      - name: cargo nextest (default features)
        run: |
          if [ "${{ matrix.toolchain }}" = "nightly" ]; then
            cargo nextest run --workspace -E 'not test(compile_fail_tests)'
          else
            cargo nextest run --workspace
          fi

      - name: cargo doctest (default features)
        run: cargo test --doc --workspace

      # The `unstable` umbrella feature enables `error_generic_member_access`
      # and `try_trait_v2`, both of which are nightly-only.
      - name: cargo check (unstable features)
        if: matrix.toolchain == 'nightly'
        run: cargo check --workspace --all-targets --features unstable

      - name: cargo nextest (unstable features)
        if: matrix.toolchain == 'nightly'
        run: cargo nextest run --workspace --features unstable

      - name: cargo doctest (unstable features)
        if: matrix.toolchain == 'nightly'
        run: cargo test --doc --workspace --features unstable

  lints:
    name: Lints (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the channel from rust-toolchain.toml so the lints job tracks
      # whatever the project is currently pinned to — fmt/clippy stay aligned
      # with what contributors run locally.
      - name: Read pinned toolchain channel
        id: rust
        run: echo "channel=$(awk -F'\"' '/^channel/ {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.rust.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lints

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (unstable features)
        run: cargo clippy --workspace --all-targets --features unstable -- -D warnings

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      # rust-toolchain.toml pins nightly; override so cargo actually uses 1.89.
      - name: Pin workspace toolchain to MSRV
        run: rustup override set 1.89

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # MSRV is a build-time guarantee for default features. The `unstable`
      # umbrella is nightly-only and explicitly out of scope for MSRV.
      - name: cargo check (MSRV, default features, locked)
        run: cargo check --workspace --all-targets --locked
