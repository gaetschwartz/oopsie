[workspace]
resolver = "3"

members = [
    "crates/oopsie",
    "crates/oopsie-core",
    "crates/oopsie-macros",
    "crates/oopsie-daisy",
]

[workspace.package]
edition = "2024"
authors = ["Gaëtan Schwartz"]

[workspace.dependencies]
oopsie-core = { path = "crates/oopsie-core" }
oopsie-macros = { path = "crates/oopsie-macros" }
oopsie-daisy = { path = "crates/oopsie-daisy" }
snafu = { version = "0.8", features = ["unstable-provider-api"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
match_same_arms = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
approx_constant = "allow"
unsafe_derive_deserialize = "allow"
struct_field_names = "allow"
similar_names = "allow"
inline_always = "allow"

# Additional nursery lints
significant_drop_tightening = "warn"
missing_const_for_fn = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
search_is_some = "warn"
significant_drop_in_scrutinee = "warn"
single_option_map = "warn"
type_repetition_in_bounds = "warn"
useless_let_if_seq = "warn"
iter_with_drain = "warn"
equatable_if_let = "warn"
clear_with_drain = "warn"
cast_possible_truncation = "allow"

# Restrictions
allow_attributes = "warn"
assertions_on_result_states = "warn"
deref_by_slicing = "warn"
error_impl_error = "warn"
exit = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
non_zero_suggestions = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
try_err = "warn"
unused_trait_names = "warn"
large_types_passed_by_value = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
borrow_interior_mutable_const = "deny"
declare_interior_mutable_const = "deny"
unwrap_or_default = "warn"

[profile.dev.package]
insta.opt-level = 3
