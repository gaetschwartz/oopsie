[package]
name = "erased-oopsie"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Serializable, type-erased error representation for transporting oopsie errors across process boundaries"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
unstable-error-generic-member-access = [
  "oopsie-core/unstable-error-generic-member-access",
]
unstable = ["unstable-error-generic-member-access", "oopsie-core/unstable"]

[dependencies]
backtrace = "0.3.76"
oopsie-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.46.3", features = ["filters", "json", "redactions"] }
oopsie = { workspace = true }
oopsie-core = { workspace = true, features = ["test-utils"] }
test-with = { version = "0.16.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[[bench]]
name = "erased"
harness = false

[lints]
workspace = true
