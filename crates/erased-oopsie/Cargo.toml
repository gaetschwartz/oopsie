[package]
name = "erased-oopsie"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
unstable-error-generic-member-access = []
unstable = ["unstable-error-generic-member-access"]

[dependencies]
backtrace = "0.3.76"
oopsie-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.46.3", features = ["filters", "json", "redactions"] }
konst = { version = "0.4.3", features = ["alloc"] }
oopsie = { workspace = true }
regex = "1.12.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[[bench]]
name = "erased"
harness = false

[lints]
workspace = true
