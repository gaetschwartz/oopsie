[package]
name = "oopsie-macros"
version = "0.1.0-rc.10"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Procedural macros for the oopsie error-handling library: the #[oopsie] attribute and Oopsie derive"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[features]
default = []
unstable-error-generic-member-access = []
unstable = ["unstable-error-generic-member-access"]
settings = ["dep:__serde", "dep:toml_edit"]

[dependencies]
__serde = { package = "serde", version = "1.0.228", features = ["derive"], optional = true }
convert_case = "0.11"
darling = "0.23"
derive-syn-parse = "0.2.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
toml_edit = { version = "0.25.12", features = ["parse", "serde"], optional = true, default-features = false }

[lints]
workspace = true

[dev-dependencies]
insta = "1.46.3"
oopsie = { workspace = true }
