[package]
name = "oopsie-macros"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[features]
default = []
unstable-error-generic-member-access = []
unstable = ["unstable-error-generic-member-access"]

[dependencies]
convert_case = "0.11"
darling = "0.23"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
insta = "1.46.3"
oopsie = { workspace = true }
