[package]
name = "oopsie"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[features]
default = ["fancy"]
unstable = ["oopsie-core/unstable", "oopsie-macros/unstable"]
fancy = ["dep:owo-colors", "dep:serde", "dep:serde_json"]

[dependencies]
oopsie-core = { workspace = true }
oopsie-macros = { workspace = true }
owo-colors = { version = "4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.46.3", features = ["filters", "json", "redactions"] }
strip-ansi-escapes = "0.2.1"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
trybuild = "1.0.116"
