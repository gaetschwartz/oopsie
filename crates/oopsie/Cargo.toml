[package]
name = "oopsie"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["fancy"]
unstable-error-generic-member-access = [
    "oopsie-macros/unstable-error-generic-member-access",
    "oopsie-core/unstable-error-generic-member-access",
    "snafu/unstable-provider-api",
]
unstable-try-trait-v2 = []
unstable = [
    "unstable-error-generic-member-access",
    "unstable-try-trait-v2",
    "oopsie-core/unstable",
]
fancy = ["dep:owo-colors", "dep:serde", "dep:serde_json"]

[dependencies]
backtrace = "0.3.76"
oopsie-core = { workspace = true }
oopsie-macros = { workspace = true }
owo-colors = { version = "4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints]
workspace = true

[dev-dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
color-eyre = "0.6.5"
criterion = "0.8.2"
eyre = "0.6.12"
insta = { version = "1.46.3", features = ["filters", "json", "redactions"] }
miette = { version = "7.6.0", features = ["fancy"] }
rustversion = "1.0.22"
snafu = { version = "0.9.1", features = ["backtrace"] }
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
trybuild = "1.0.116"

[[bench]]
name = "capture"
harness = false

[[bench]]
name = "construct"
harness = false

[[bench]]
name = "propagate"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "vs_ecosystem"
harness = false
