[package]
name = "oopsie-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
unstable-error-generic-member-access = []
unstable = ["unstable-error-generic-member-access"]
test-utils = ["dep:insta", "dep:target-triple", "dep:konst"]
chrono = ["dep:chrono"]

[dependencies]
backtrace = { version = "0.3.76", features = ["coresymbolication"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
insta = { version = "1.47.2", features = [
    "filters",
    "json",
    "redactions",
], optional = true }
konst = { version = "0.4.3", features = ["alloc"], optional = true }
serde = { version = "1", features = ["derive"] }
target-triple = { version = "1.0.0", optional = true }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


[dev-dependencies]
oopsie = { workspace = true }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = "0.3"

[lints]
workspace = true
