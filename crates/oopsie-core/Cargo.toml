[package]
name = "oopsie-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[features]
default = []
unstable = ["dep:smallbox"]

[dependencies]
backtrace = "0.3.76"
color-backtrace = { version = "0.7.2", features = [
    "use-backtrace-crate",
    "use-btparse-crate",
] }
color-eyre = "0.6.5"
serde = { version = "1", features = ["derive"] }
smallbox = { version = "0.8.8", features = [
    "nightly",
    "coerce",
], optional = true }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]

[lints]
workspace = true
