[package]
name = "oopsie-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core error types and trace capture for the oopsie error-handling library"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "dep:strum", "tracing-subscriber?/json"]
tracing = ["dep:tracing", "dep:tracing-error", "dep:tracing-subscriber"]
unstable-error-generic-member-access = []
unstable = ["unstable-error-generic-member-access"]
test-utils = ["dep:insta", "dep:target-triple", "dep:konst"]
chrono = ["dep:chrono"]

[dependencies]
backtrace = { version = "0.3.76", features = ["coresymbolication"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
insta = { version = "1.47.2", features = [
    "filters",
    "json",
    "redactions",
], optional = true }
konst = { version = "0.4.3", features = ["alloc"], optional = true }
linkme = "0.3.36"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
target-triple = { version = "1.0.0", optional = true }
tracing = { version = "0.1", optional = true }
tracing-error = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }


[dev-dependencies]
oopsie = { workspace = true }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = "0.3"

[lints]
workspace = true
