[package]
name = "oopsie-daisy"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[features]
default = []
unstable = ["oopsie-core/unstable"]

[dependencies]
oopsie-core = { workspace = true }
color-backtrace = { version = "0.7.2", features = [
    "use-backtrace-crate",
    "use-btparse-crate",
] }
color-spantrace = "0.3"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
